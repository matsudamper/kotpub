name: Publish snapshot

# main: gradle.properties の latest-SNAPSHOT を上書き公開
# PR: 一意の仮バージョン（上書きしない）
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  pull-requests: write

# 古い実行が後から終わって、新しいバージョンのコメントを上書きしないようにする
concurrency:
  group: publish-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: GitHub Packages へ公開
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: バージョンを決める
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              version="0.0.0-pr${PR_NUMBER}-${PR_HEAD_SHA:0:7}"
              ;;
            push)
              version="$(sed -n 's/^version=//p' gradle.properties)"
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "::notice::公開するバージョン: $version"

      - name: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion="$VERSION"

      - name: PR に公開したバージョンを書く
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-version
          message: "試用版を公開しました: `${{ env.VERSION }}`"
