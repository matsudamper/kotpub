name: Release

# v0.1.0 のタグと GitHub Release を作る。タグの push で Publish が走り GitHub Packages に配信する
on:
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: 0.1.0）。タグは v<version>"
        required: true
        type: string
      make_latest:
        description: "Latest リリースにする（オンならリリースノートを自動生成）"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release を作成
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: バージョンを検証する
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          trimmed="${INPUT_VERSION#v}"
          if ! [[ "$trimmed" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version は 0.1.0 のような形式で指定してください（先頭の v は省略可）: $INPUT_VERSION"
            exit 1
          fi
          echo "VERSION=$trimmed" >> "$GITHUB_ENV"
          echo "TAG=v$trimmed" >> "$GITHUB_ENV"

      - name: GitHub Release を作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" --target "$GITHUB_SHA" --title "$TAG")
          if [ "$MAKE_LATEST" = "true" ]; then
            args+=(--generate-notes --latest)
          else
            args+=(--latest=false)
          fi
          gh "${args[@]}"
          echo "::notice::Release $TAG を作成しました。Publish ワークフローがタグを見て GitHub Packages に配信します"
