name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # ktlintCheck とテストを含む
      - name: build
        run: ./gradlew build

      - name: upload jars
        id: upload-jars
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-pr${{ github.event.pull_request.number }}
          path: "*/build/libs/*.jar"
          if-no-files-found: error

    outputs:
      jars-artifact-url: ${{ steps.upload-jars.outputs.artifact-url }}

  comment-jars:
    name: comment jars link
    needs: build
    # フォークからの PR はトークンに書き込み権限が無くコメントできない
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: comment jars link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JARS_ARTIFACT_URL: ${{ needs.build.outputs.jars-artifact-url }}
        with:
          script: |
            const marker = '<!-- jars-artifact-link -->';
            const body = [
              marker,
              `ビルドした jar: ${process.env.JARS_ARTIFACT_URL}`,
              '',
              `コミット: ${context.payload.pull_request.head.sha}`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
