name: Publish

# v0.1.0 のようなタグを push すると、そのバージョンで GitHub Packages に公開する。
# GitHub Packages は同じバージョンを上書きできないので、公開し直すときはタグを進める
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: GitHub Packages へ公開
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: build
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"

      - name: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pversion="${GITHUB_REF_NAME#v}"
