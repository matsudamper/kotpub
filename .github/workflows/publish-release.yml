name: Publish release

# 正式版: 手動実行または v* タグの push で公開する。手動実行では公開に成功した後に GitHub Release + v タグを作る
# 配布先は手動実行時に選ぶ。タグ push では各入力のデフォルト値と同じ配布先に出す
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン（例: 0.1.0）"
        required: true
        type: string
      make_latest:
        description: "Latest リリースにする"
        required: true
        type: boolean
        default: true
      publish_maven_central:
        description: "Maven Central に公開する"
        required: true
        type: boolean
        default: false
      publish_github_packages:
        description: "GitHub Packages に公開する"
        required: true
        type: boolean
        default: true
      publish_matsudamper_maven:
        description: "maven.matsudamper.net に公開する"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: リリースと Maven リポジトリへの公開
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: バージョンを決める
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              trimmed="${INPUT_VERSION#v}"
              if ! [[ "$trimmed" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                echo "::error::version は 0.1.0 のような形式で指定してください（先頭の v は省略可）: $INPUT_VERSION"
                exit 1
              fi
              version="$trimmed"
              ;;
            push)
              version="${GITHUB_REF_NAME#v}"
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "::notice::公開するバージョン: $version"

      - name: 公開タスクを決める
        env:
          PUBLISH_MAVEN_CENTRAL: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_maven_central || false }}
          PUBLISH_GITHUB_PACKAGES: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_github_packages }}
          PUBLISH_MATSUDAMPER_MAVEN: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_matsudamper_maven }}
        run: |
          set -euo pipefail
          tasks=()
          if [ "$PUBLISH_MAVEN_CENTRAL" = "true" ]; then
            tasks+=(publishToMavenCentral)
            echo "MAVEN_CENTRAL_PUBLISHING=true" >> "$GITHUB_ENV"
          else
            echo "MAVEN_CENTRAL_PUBLISHING=false" >> "$GITHUB_ENV"
          fi
          if [ "$PUBLISH_GITHUB_PACKAGES" = "true" ]; then
            tasks+=(publishAllPublicationsToGitHubPackagesRepository)
          fi
          if [ "$PUBLISH_MATSUDAMPER_MAVEN" = "true" ]; then
            tasks+=(publishAllPublicationsToMatsudamperMavenRepository)
          fi
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::配布先が 1 つも選ばれていません"
            exit 1
          fi
          echo "PUBLISH_TASKS=${tasks[*]}" >> "$GITHUB_ENV"
          echo "::notice::公開タスク: ${tasks[*]}"

      - name: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_MATSUDAMPER_USERNAME: ${{ secrets.MAVEN_MATSUDAMPER_USERNAME }}
          MAVEN_MATSUDAMPER_TOKEN: ${{ secrets.MAVEN_MATSUDAMPER_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        # PUBLISH_TASKS は空白区切りで複数タスクを渡すため、あえてクォートしない
        run: ./gradlew $PUBLISH_TASKS -PmavenCentralPublishing="$MAVEN_CENTRAL_PUBLISHING" -PmavenCentralAutomaticPublishing=true -PsignAllPublications=true -Pversion="$VERSION"

      - name: GitHub Release を作成
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" --target "$GITHUB_SHA" --title "$TAG")
          if [ "$MAKE_LATEST" = "true" ]; then
            args+=(--generate-notes --latest)
          else
            args+=(--latest=false)
          fi
          gh "${args[@]}"
